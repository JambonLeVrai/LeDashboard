[env:esp32-4848s040]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200

; Custom board configuration for ESP32-4848S040
board_build.mcu = esp32s3
board_build.variant = esp32s3
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; LVGL Configuration
lib_deps =
	lvgl/lvgl@^9.2.0
    moononournation/GFX Library for Arduino@1.4.9

; Build configuration
build_type = release
build_flags =
    -Iinclude
    -Ilib/Touch_GT911
    -D LVGL_USE_ARDUINO_GFX
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH="\"${PROJECT_DIR}/include/lv_conf.h\""
    -D BOARD_HAS_PSRAM
    -D LV_COLOR_DEPTH=16
    -D LV_COLOR_16_SWAP=0
    -D LV_USE_GPU_ESP32_PSRAM=0
    -D LV_DEFAULT_PAGE_SIZE=256
    -D LV_DISP_DEF_REFR_PERIOD=30
    -D LV_FILESYSTEM_EN=0
    -D LV_USE_FREETYPE=0
    -D LV_FONT_ROTATION=1
    -D LV_FONT_FMT_TXT_LARGE=0
    -D LV_USE_BMP=0
    -D LV_USE_PNG=0
    -D LV_USE_JPG=0
    -D LV_USE_GIF=0
    -D LV_USE_JSON=0
    -D LV_USE_LOG=0
    -D LV_USE_ASSERT=0
    -D LV_USE_METRICS=0
    -D LV_USE_PERF_MONITOR=0

; Memory configuration
board_build.partitions = partitions_custom.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Source files
src_build_flags =
    -Iinclude
    -Iinclude/ui
    -Iinclude/data

; Custom build script
extra_scripts = 
    pre:prebuild.py
